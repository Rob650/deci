<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DECI — Project Intelligence</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0c0f;
      --surface:   #111418;
      --border:    #1e2329;
      --border-hi: #2d3540;
      --accent:    #00d4ff;
      --accent-dim:#007fa0;
      --green:     #00e676;
      --red:       #ff4444;
      --yellow:    #ffc107;
      --text:      #e8eaed;
      --text-muted:#6b7280;
      --text-dim:  #9ca3af;
      --radius:    8px;
      --font:      'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .wrapper {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* ── Header ── */
    header {
      padding: 48px 0 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: 0.25em;
      color: var(--accent);
      text-shadow: 0 0 32px rgba(0, 212, 255, 0.3);
      font-variant-numeric: tabular-nums;
    }

    .tagline {
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Input Section ── */
    .input-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 32px;
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    .url-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-input::placeholder { color: var(--text-muted); }
    .url-input:focus { border-color: var(--accent-dim); }

    .analyze-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 12px 28px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }

    .analyze-btn:hover:not(:disabled) { background: #33ddff; }
    .analyze-btn:active:not(:disabled) { transform: scale(0.98); }
    .analyze-btn:disabled { background: var(--accent-dim); cursor: not-allowed; opacity: 0.7; }

    /* ── Loading State ── */
    #loading {
      display: none;
      text-align: center;
      padding: 48px 0;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border-hi);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .loading-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .loading-steps {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .step {
      font-size: 0.78rem;
      color: var(--text-muted);
      transition: color 0.4s;
    }
    .step.active { color: var(--accent); }
    .step.done { color: var(--green); }
    .step.done::before { content: "✓ "; }

    /* ── Error Banner ── */
    #error-banner {
      display: none;
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: var(--radius);
      color: var(--red);
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 0.88rem;
    }

    /* ── Results ── */
    #results { display: none; }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .results-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .results-url {
      font-size: 0.82rem;
      color: var(--accent);
      word-break: break-all;
    }

    .results-pages {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .new-analysis-btn {
      background: transparent;
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 0.8rem;
      padding: 8px 16px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .new-analysis-btn:hover { border-color: var(--accent-dim); color: var(--accent); }

    /* ── Cards ── */
    .cards-grid {
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border-hi); }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .card-body {
      font-size: 0.9rem;
      line-height: 1.75;
      color: var(--text-dim);
      white-space: pre-wrap;
    }

    /* Card accent colors */
    .card--focus  .card-icon { background: rgba(0, 212, 255, 0.12); }
    .card--team   .card-icon { background: rgba(0, 230, 118, 0.12); }
    .card--roadmap .card-icon { background: rgba(255, 193, 7, 0.12); }
    .card--uvp    .card-icon { background: rgba(147, 51, 234, 0.12); }
    .card--comp   .card-icon { background: rgba(249, 115, 22, 0.12); }
    .card--risk   .card-icon { background: rgba(255, 68, 68, 0.12); }

    .card--risk .card-body { color: #e8a09a; }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 32px 0 0;
      font-size: 0.74rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      border-top: 1px solid var(--border);
      margin-top: 40px;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .input-row { flex-direction: column; }
      .analyze-btn { width: 100%; }
      .results-header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .logo { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="logo">DECI</div>
      <div class="tagline">Project Intelligence</div>
    </header>

    <!-- Input -->
    <div class="input-section">
      <div class="input-row">
        <input
          type="text"
          id="url-input"
          class="url-input"
          placeholder="https://projectname.io"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="analyze-btn" class="analyze-btn">ANALYZE</button>
      </div>
    </div>

    <!-- Error -->
    <div id="error-banner"></div>

    <!-- Loading -->
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-title">Analyzing Project</div>
      <div class="loading-sub">Scraping website and generating intelligence report...</div>
      <div class="loading-steps">
        <div class="step" id="step-1">Fetching main page</div>
        <div class="step" id="step-2">Crawling linked pages</div>
        <div class="step" id="step-3">Extracting content</div>
        <div class="step" id="step-4">Running AI analysis</div>
        <div class="step" id="step-5">Generating report</div>
      </div>
    </div>

    <!-- Results -->
    <div id="results">
      <div class="results-header">
        <div class="results-meta">
          <div class="results-url" id="results-url"></div>
          <div class="results-pages" id="results-pages"></div>
        </div>
        <button class="new-analysis-btn" id="new-analysis-btn">+ New Analysis</button>
      </div>
      <div class="cards-grid" id="cards-grid"></div>
    </div>

    <footer>DECI &mdash; POWERED BY CLAUDE &mdash; FOR RESEARCH PURPOSES ONLY</footer>
  </div>

  <script>
    const CARDS_CONFIG = [
      {
        key: "project_focus",
        title: "Project Focus",
        icon: "◎",
        cls: "card--focus",
      },
      {
        key: "team",
        title: "Team",
        icon: "◈",
        cls: "card--team",
      },
      {
        key: "roadmap",
        title: "Roadmap",
        icon: "◷",
        cls: "card--roadmap",
      },
      {
        key: "unique_value_proposition",
        title: "Unique Value Proposition",
        icon: "◆",
        cls: "card--uvp",
      },
      {
        key: "competitors",
        title: "Competitors",
        icon: "◉",
        cls: "card--comp",
      },
      {
        key: "execution_risk",
        title: "Execution Risk",
        icon: "⚠",
        cls: "card--risk",
      },
    ];

    const urlInput   = document.getElementById("url-input");
    const analyzeBtn = document.getElementById("analyze-btn");
    const loading    = document.getElementById("loading");
    const results    = document.getElementById("results");
    const errorBanner = document.getElementById("error-banner");
    const cardsGrid  = document.getElementById("cards-grid");
    const newAnalysisBtn = document.getElementById("new-analysis-btn");

    const steps = [
      document.getElementById("step-1"),
      document.getElementById("step-2"),
      document.getElementById("step-3"),
      document.getElementById("step-4"),
      document.getElementById("step-5"),
    ];

    let stepInterval = null;

    function startStepAnimation() {
      let current = 0;
      steps.forEach(s => { s.className = "step"; });
      steps[0].classList.add("active");

      const timings = [2000, 6000, 12000, 18000];
      timings.forEach((delay, i) => {
        setTimeout(() => {
          steps[i].classList.remove("active");
          steps[i].classList.add("done");
          if (i + 1 < steps.length) {
            steps[i + 1].classList.add("active");
          }
        }, delay);
      });
    }

    function showLoading() {
      errorBanner.style.display = "none";
      results.style.display = "none";
      loading.style.display = "block";
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = "ANALYZING…";
      startStepAnimation();
    }

    function hideLoading() {
      loading.style.display = "none";
      analyzeBtn.disabled = false;
      analyzeBtn.textContent = "ANALYZE";
    }

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
      results.style.display = "none";
    }

    function renderResults(data) {
      document.getElementById("results-url").textContent = data.url;
      document.getElementById("results-pages").textContent =
        `${data.pages_scraped} page${data.pages_scraped !== 1 ? "s" : ""} analyzed`;

      cardsGrid.innerHTML = "";
      CARDS_CONFIG.forEach(cfg => {
        const text = data.report[cfg.key] || "Not available.";
        const card = document.createElement("div");
        card.className = `card ${cfg.cls}`;
        card.innerHTML = `
          <div class="card-header">
            <div class="card-icon">${cfg.icon}</div>
            <div class="card-title">${cfg.title}</div>
          </div>
          <div class="card-body">${escapeHtml(text)}</div>
        `;
        cardsGrid.appendChild(card);
      });

      results.style.display = "block";
      results.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function runAnalysis() {
      const url = urlInput.value.trim();
      if (!url) {
        urlInput.focus();
        return;
      }

      showLoading();

      try {
        const resp = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });

        const data = await resp.json();

        hideLoading();

        if (!resp.ok) {
          showError(data.detail || "An error occurred. Please try again.");
          return;
        }

        renderResults(data);

      } catch (err) {
        hideLoading();
        showError("Network error — could not reach the server. Please try again.");
      }
    }

    analyzeBtn.addEventListener("click", runAnalysis);

    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runAnalysis();
    });

    newAnalysisBtn.addEventListener("click", () => {
      results.style.display = "none";
      errorBanner.style.display = "none";
      urlInput.value = "";
      urlInput.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
